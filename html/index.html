<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>铁路作业</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="header-box">
        <video class="bg-video" autoplay loop muted playsinline>
            <source src="../video/1.mp4" type="video/mp4">
        </video>
        <img class="bg-img gongwu" src="../images/1.jpg" alt="工务">
        <img class="bg-img jiwu" src="../images/2.jpg" alt="机务">
        <img class="bg-img chewu" src="../images/3.jpg" alt="车务">
        <img class="bg-img dianwu" src="../images/4.jpg" alt="电务">
        <img class="bg-img cheliang" src="../images/5.jpg" alt="车辆">
        <div class="mask"></div>
        <div class="header-text">
            <h1>铁路五大系统</h1>
            <p>匠心守护 万里通途</p>
        </div>
        <div class="card-box">
            <div class="card-item active" data-type="index" onclick="location.href='index.html'">
                <span class="card-text">首页</span>
                <img src="../images/6.jpg" alt="首页">
            </div>
            <div class="card-item" data-type="gongwu" onclick="location.href='system-gongwu.html'">
                <span class="card-text">工务</span>
                <img src="../images/7.jpg" alt="工务">
            </div>
            <div class="card-item" data-type="jiwu" onclick="location.href='system-jiwu.html'">
                <span class="card-text">机务</span>
                <img src="../images/8.jpg" alt="机务">
            </div>
            <div class="card-item" data-type="chewu" onclick="location.href='system-chewu.html'">
                <span class="card-text">车务</span>
                <img src="../images/9.jpg" alt="车务">
            </div>
            <div class="card-item" data-type="dianwu" onclick="location.href='system-dianwu.html'">
                <span class="card-text">电务</span>
                <img src="../images/10.jpg" alt="电务">
            </div>
            <div class="card-item" data-type="cheliang" onclick="location.href='system-cheliang.html'">
                <span class="card-text">车辆</span>
                <img src="../images/11.jpg" alt="车辆">
            </div>
            <div class="card-item" onclick="location.href='life-photo.html'">
                <span class="card-text">图文纪实</span>
                <img src="../images/14.jpg" alt="图文纪实">
            </div>
            <div class="card-item" onclick="location.href='ai.html'">
                <span class="card-text">AI助手</span>
                <img src="../images/12.jpg" alt="AI助手">
            </div>
            <div class="card-item" onclick="location.href='about-us.html'">
                <span class="card-text">关于我们</span>
                <img src="../images/13.jpg" alt="关于我们">
            </div>
        </div>
    </div>

    <div class="content-box">
        <div class="content-bg"></div>
        <div class="content-inner">
            <div class="content-wrap">
                <div class="video-area">
                    <video class="placeholder-video" autoplay loop muted playsinline>
                        <source src="../video/2.mp4" type="video/mp4">
                    </video>
                </div>
                <div class="text-area">
                    <h2>铁路系统介绍</h2>
                    <p>铁路系统分为工务、机务、车务、电务、车辆五大系统，共同保障列车安全平稳运行。</p>
                    <p>工务负责线路养护，机务负责机车检修，车务负责客运组织，电务负责信号通信，车辆负责车厢维护。</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const video = document.querySelector('.bg-video');
        const allImg = document.querySelectorAll('.bg-img');
        const cards = document.querySelectorAll('.card-item');
        const cardBox = document.querySelector('.card-box');

        // 悬浮切换背景
        cards.forEach(item => {
            item.addEventListener('mouseenter', () => {
                const type = item.dataset.type;
                if(type && type !== 'index'){
                    video.style.display = 'none';
                    allImg.forEach(img => img.style.display = 'none');
                    document.querySelector(`.bg-img.${type}`).style.display = 'block';
                }
            })
            item.addEventListener('mouseleave', () => {
                video.style.display = 'block';
                allImg.forEach(img => img.style.display = 'none');
            })
        })

        // 闲置动画控制：8秒无操作环绕一次，触碰立即暂停
        let idleTimer;
        function startIdleTimer(){
            idleTimer = setTimeout(()=>{
                cardBox.classList.add('loop-animate');
                setTimeout(()=>{
                    cardBox.classList.remove('loop-animate');
                    startIdleTimer();
                },1600)
            },8000)
        }
        function resetTimer(){
            clearTimeout(idleTimer);
            cardBox.classList.remove('loop-animate');
            startIdleTimer();
        }
        // 鼠标触碰卡片暂停动画
        cardBox.addEventListener('mouseenter', resetTimer);
        window.addEventListener('load', startIdleTimer);
    </script>
</body>
</html>
