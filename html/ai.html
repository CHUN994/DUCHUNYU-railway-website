<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AI助手</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="header-box">
        <img class="bg-video" src="../images/21.jpg">
        <div class="mask"></div>
        <div class="header-text">
            <h1>AI铁路助手</h1>
            <p>专业问答 · 知识查询 · 智能解答</p>
        </div>
        <div class="card-box">
            <div class="card-item" onclick="location.href='index.html'">
                <span class="card-text">首页</span>
                <img src="../images/6.jpg" alt="首页">
            </div>
            <div class="card-item" onclick="location.href='system-gongwu.html'">
                <span class="card-text">工务</span>
                <img src="../images/7.jpg" alt="工务">
            </div>
            <div class="card-item" onclick="location.href='system-jiwu.html'">
                <span class="card-text">机务</span>
                <img src="../images/8.jpg" alt="机务">
            </div>
            <div class="card-item" onclick="location.href='system-chewu.html'">
                <span class="card-text">车务</span>
                <img src="../images/9.jpg" alt="车务">
            </div>
            <div class="card-item" onclick="location.href='system-dianwu.html'">
                <span class="card-text">电务</span>
                <img src="../images/10.jpg" alt="电务">
            </div>
            <div class="card-item" onclick="location.href='system-cheliang.html'">
                <span class="card-text">车辆</span>
                <img src="../images/11.jpg" alt="车辆">
           </div>
            <div class="card-item" onclick="location.href='system-gongdian.html'">
                <span class="card-text">供电</span>
               <img src="../images/30.jpg" alt="供电">
            </div>
            <div class="card-item" onclick="location.href='life-photo.html'">
                <span class="card-text">图文纪实</span>
                <img src="../images/14.jpg" alt="图文纪实">
            </div>
            <div class="card-item active" onclick="location.href='ai.html'">
                <span class="card-text">AI助手</span>
                <img src="../images/12.jpg" alt="AI助手">
            </div>
            <div class="card-item" onclick="location.href='about-us.html'">
                <span class="card-text">关于我们</span>
                <img src="../images/13.jpg" alt="关于我们">
            </div>
        </div>
    </div>

    <div class="content-box">
        <div class="content-bg"></div>
        <div class="content-inner">
            <div class="content-wrap chat-wrap">
                <div class="chat-content" id="chatContent">
                    <div class="ai-msg">
                        <p>你好！我是铁路专业AI助手，可咨询工务、机务、车务、电务、车辆全部专业知识点，随时提问~</p>
                    </div>
                </div>
                <div class="chat-input">
                    <textarea id="userInput" placeholder="输入问题，回车发送..."></textarea>
                    <button id="sendBtn">发送</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const chatContent = document.getElementById('chatContent');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        function addMsg(text, isUser){
            const div = document.createElement('div');
            div.className = isUser ? 'user-msg' : 'ai-msg';
            div.innerHTML = `<p>${text}</p>`;
            chatContent.appendChild(div);
            chatContent.scrollTop = chatContent.scrollHeight;
        }
        function sendMessage(){
            const text = userInput.value.trim();
            if(!text) return;
            addMsg(text, true);
            userInput.value = '';
            setTimeout(()=>{
                addMsg('已收到你的问题，等待接入AI大模型后即可智能回复~', false);
            },800)
        }
        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keydown', e=>{
            if(e.key === 'Enter' && !e.shiftKey){
                e.preventDefault();
                sendMessage();
            }
        })

        const cardBox = document.querySelector('.card-box');
        let idleTimer;
        function startIdleTimer(){
            idleTimer = setTimeout(()=>{
                cardBox.classList.add('loop-animate');
                setTimeout(()=>{
                    cardBox.classList.remove('loop-animate');
                    startIdleTimer();
                },1600)
            },8000)
        }
        function resetTimer(){
            clearTimeout(idleTimer);
            cardBox.classList.remove('loop-animate');
            startIdleTimer();
        }
        cardBox.addEventListener('mouseenter', resetTimer);
        window.addEventListener('load', startIdleTimer);
    </script>
</body>
</html>
